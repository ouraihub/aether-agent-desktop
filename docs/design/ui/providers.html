<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aether · 模型服务设计预览</title>
    <link rel="stylesheet" href="./providers.css">
    <script type="module" src="./providers.mjs"></script>
</head>
<body>
    <header class="preview-tools" aria-label="预览工具（非产品界面）">
        <a href="./index.html">返回工作台</a>
        <span>Autorail 源码对照 · 模型服务</span>
        <label>主题 <select id="appearance"><option value="dark">深色</option><option value="light">浅色</option></select></label>
        <label>强调色 <select id="accent"><option value="autorail">Autorail 原色</option><option value="blue">蓝</option><option value="violet">紫</option></select></label>
        <label>示例 <select id="fixture"><option value="screenshot">截图空配置</option><option value="populated">交互示例（线路/模型/掩码）</option></select></label>
        <a href="./providers-reference.md">源码与尺寸对照</a>
    </header>
    <main>
        <section id="settings-dialog" class="settings-dialog" role="dialog" aria-modal="false" aria-labelledby="settings-title">
            <header class="dialog-heading"><h1 id="settings-title">设置</h1><button id="settings-close" class="icon-button ghost" aria-label="关闭设置" data-icon="close"></button></header>
            <div id="settings-shell" class="settings-shell">
                <nav id="settings-nav" class="settings-nav" aria-label="设置导航">
                    <div class="nav-group">AGENT</div>
                    <button data-nav="models"><span data-icon="brain"></span>模型</button>
                    <button data-nav="providers" class="active" aria-current="page"><span data-icon="key"></span>模型服务</button>
                    <button data-nav="coding"><span data-icon="terminal"></span>编码搭档</button>
                    <button data-nav="mcp"><span data-icon="plug"></span>MCP 服务器</button>
                    <button data-nav="logs"><span data-icon="logs"></span>后台日志</button>
                    <div class="nav-group interface-group">界面</div>
                    <button data-nav="appearance"><span data-icon="palette"></span>外观</button>
                </nav>
                <div id="settings-content" class="settings-content">
                    <div class="providers-page">
                        <aside id="provider-rail" class="provider-rail" aria-label="服务商">
                            <div class="rail-search"><label class="search"><span data-icon="search"></span><input id="provider-search" placeholder="搜索模型平台…" aria-label="搜索模型平台"></label><button id="providers-filter" class="icon-button" aria-label="筛选服务商" data-icon="filter" aria-expanded="false"></button></div>
                            <div id="provider-rows" class="provider-rows"></div>
                            <button id="providers-add" class="ghost"><span data-icon="plus"></span>新建服务商</button>
                        </aside>
                        <section id="provider-detail" class="provider-detail" aria-label="服务商详情"></section>
                    </div>
                </div>
            </div>
        </section>
        <aside class="preview-note"><strong>设计预览未接Backend</strong> · 仅内存中的视图状态；不读取真实配置、不发网络请求、不保存配置。请勿输入真实密钥。已参考用户截图；原版截图不在本仓库，本页不是像素级截图验证。Aether 不回显/复制原密钥。</aside>
        <p id="preview-status" role="status" aria-live="polite">选择服务商查看布局；检测、同步与写入操作均不会执行。</p>
        <button id="settings-reopen" hidden>重新打开设置</button>
    </main>
    <div id="popup-menu" class="popup-menu" role="menu" hidden></div>
    <dialog id="provider-modal" aria-labelledby="modal-title">
        <form id="modal-form">
            <header class="dialog-heading"><h2 id="modal-title"></h2><button type="button" id="modal-close" class="icon-button ghost" aria-label="关闭对话框" data-icon="close"></button></header>
            <div id="modal-body" class="modal-body"></div>
            <p id="modal-status" class="modal-status" role="status">设计预览未接Backend；填写内容不会保存，请勿输入真实密钥。</p>
            <footer id="modal-footer" class="modal-footer"></footer>
        </form>
    </dialog>
</body>
</html>
